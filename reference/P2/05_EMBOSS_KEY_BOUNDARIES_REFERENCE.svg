<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="208mm" height="58mm" viewBox="0 0 208 58"><title>Wing27 P2 / 黒地・文字のみ透光 / Black background, translucent legends only</title><desc>加工相談用、正面図、mm、原寸1:1。左右一体208 x 58 mm、中央切抜きなし。中央キー間92 mm。補助星印を削除、単独星印2キーは無刻印だがエンボス対象。既存Fnのみ印字。文字は乳白透光、背景と十字は遮光。Engineering review. FRONT VIEW, millimeters, 1:1. ONE continuous 208 x 58 mm overlay, NO central cutout. 92 mm inner key-edge clearance. Remove all star placeholders. Keep two blank keys as emboss regions without translucent windows. Retain the existing Fn legend only. Milky-white translucent legends; opaque black background and opaque gray cross. Emboss tooling, adhesive, ink stack and final outer contour need proof approval.</desc><g id="GUIDE_KEY_BOUNDARIES_NOT_PRINT_NOT_CUT"><rect id="key-L1_1" x="5.000" y="5.000" width="6.000" height="8.000" rx="1.5" fill="none" stroke="#277A99" stroke-width="0.15"/><rect id="key-L1_2" x="13.000" y="5.000" width="6.000" height="8.000" rx="1.5" fill="none" stroke="#277A99" stroke-width="0.15"/><rect id="key-L1_3" x="21.000" y="5.000" width="6.000" height="8.000" rx="1.5" fill="none" stroke="#277A99" stroke-width="0.15"/><rect id="key-L1_4" x="29.000" y="5.000" width="6.000" height="8.000" rx="1.5" fill="none" stroke="#277A99" stroke-width="0.15"/><rect id="key-L1_5" x="37.000" y="5.000" width="6.000" height="8.000" rx="1.5" fill="none" stroke="#277A99" stroke-width="0.15"/><rect id="key-L1_6" x="45.000" y="5.000" width="6.000" height="8.000" rx="1.5" fill="none" stroke="#277A99" stroke-width="0.15"/><rect id="key-L2_1" x="5.000" y="15.000" width="8.000" height="8.000" rx="1.5" fill="none" stroke="#277A99" stroke-width="0.15"/><rect id="key-L2_2" x="15.000" y="15.000" width="6.000" height="8.000" rx="1.5" fill="none" stroke="#277A99" stroke-width="0.15"/><rect id="key-L2_3" x="23.000" y="15.000" width="6.000" height="8.000" rx="1.5" fill="none" stroke="#277A99" stroke-width="0.15"/><rect id=